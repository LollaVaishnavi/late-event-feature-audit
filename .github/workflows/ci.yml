name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests experiments tools

      - name: Run test suite with coverage
        run: |
          pytest --junitxml=junit.xml --cov=late_event_feature_audit --cov-report=json:coverage.json --cov-report=xml:coverage.xml

      - name: Enforce 90% line coverage floor
        run: |
          python -c "
          import xml.etree.ElementTree as ET, sys
          rate = float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100.0
          print(f'Line coverage: {rate:.1f}%')
          sys.exit(0 if rate >= 90.0 else 1)
          "

      - name: Re-run experiments and verify receipts
        if: matrix.python-version == '3.11'
        run: |
          python experiments/exp01_batch_vs_point_in_time_leakage.py
          python experiments/exp02_lateness_tail_vs_auc_inflation.py
          python experiments/exp03_watermark_drop_vs_leakage_tradeoff.py
          python experiments/exp04_multicloud_manifest_parity.py
          python tools/collect_metrics.py --skip-tests --reuse-experiments
          python tools/check_numbers.py

      - name: Publish watermark eviction trade-off table to job summary
        if: matrix.python-version == '3.11'
        run: |
          python -c "
          import json, os
          from pathlib import Path
          exp03 = json.loads(Path('docs/experiments/exp03_watermark_drop_vs_leakage_tradeoff.json').read_text())
          lines = [
              '### Spark Streaming Watermark Eviction Trade-Off',
              '',
              '| Watermark | Dropped Events | Late Events Dropped | Online AUC |',
              '| ---: | ---: | ---: | ---: |',
          ]
          for r in exp03['watermarks']:
              lines.append(
                  f\"| {r['watermark_minutes']:.0f} min | {r['dropped_events_count']} | \"
                  f\"{r['dropped_late_share_pct']:.1f}% | {r['online_auc']:.4f} |\"
              )
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as fh:
                  fh.write('\n'.join(lines) + '\n')
          else:
              print('\n'.join(lines))
          "

      - name: Upload experiment artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            docs/experiments/*.json
            docs/metrics.json
