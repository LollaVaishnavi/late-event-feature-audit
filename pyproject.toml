[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "late-event-feature-audit"
version = "0.1.0"
description = "Audit point-in-time feature leakage from late-arriving streaming events."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Vaishnavi Lolla", email = "Vaishnavilolla@mycvcareer.com"},
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
evidence = [
    "pillow>=10.0",
    "weasyprint>=60.0",
]

[project.scripts]
late-event-feature-audit = "late_event_feature_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"src/late_event_feature_audit/report.py" = ["E501"]
"tools/render_diagrams.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
